---
name: Weekly

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ahead:
    name: On Python ${{ matrix.python }}, newest tools
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      - name: Install the newest tools
        run: |
          python -m pip install --disable-pip-version-check \
            --upgrade ruff mypy coverage setuptools

      - name: Formatting, as the newest formatter sees it
        run: ruff format --check .

      - name: Lint, with whatever rules were added since
        run: ruff check --output-format=github .

      - name: Types, as the newest checker sees them
        run: mypy

      - name: Every test module, under coverage
        run: |
          python -m coverage erase
          status=0
          for module in tms9918/*.test.py conformance/*.test.py; do
            echo "::group::${module}"
            python -m coverage run -a "${module}" || status=1
            echo "::endgroup::"
          done
          exit "${status}"
        shell: bash

      - name: Coverage must still be total
        run: python -m coverage report

  quotes:
    name: Every quote against the manual it names
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the text extractor
        run: sudo apt-get install --yes --no-install-recommends poppler-utils

      - name: Bring the manual down and refuse any other file
        run: python -m conformance.documents

      - name: Every quote against the manual it names
        run: python -m conformance.quotes

      - name: The reader against the manual
        run: python conformance/manual.test.py

  pins:
    name: How far behind the submodules are
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Compare every pin against its upstream head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          advice="Bump it, run the suite, and read what changed"
          advice="${advice} before recording any new output."
          git submodule status | while read -r sha path _rest; do
            sha="${sha#[-+]}"
            name="${path##*/}"
            head=$(gh api "repos/${owner}/${name}/commits?per_page=1" \
              --jq '.[0].sha')
            if [ "${sha}" = "${head}" ]; then
              echo "${name}: at head"
              continue
            fi
            count=$(gh api "repos/${owner}/${name}/compare/${sha}...${head}" \
              --jq '.ahead_by')
            title="${name} is behind"
            echo "::warning title=${title}::${count} behind ${head}. ${advice}"
          done
        shell: bash
